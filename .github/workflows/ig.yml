# IG 自動發文：每 15 分鐘看一次 posts/ig.json，發「已審核、時間到」的貼文，發完把 posted 寫回去。
# 不合規格（不是 JPEG、比例超出 4:5～1.91:1）或發文失敗的貼文會寫 error 欄位、這次顯示失敗（GitHub 寄信），之後不再重試。
# 每週一確認一次 token 還能用（系統用戶權杖不會過期，不用換）。每天台灣時間 23:27 抓一次數字，寫到 stats/ig/YYYY-MM-DD.json。
# 需要的加密設定（Settings → Secrets and variables → Actions）：
#   IG_TOKEN        Meta 後台「API setup with Unified login」產生的系統用戶權杖（EAA 開頭）
name: IG 自動發文
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 2 * * 1'
    - cron: '27 15 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'check（只檢查規格）、post（發到期的貼文）、token（確認 token 能用）或 stats（抓數字）'
        default: check
permissions:
  contents: write
env:
  IG_USER_ID: '17841416960586035'   # mochachen12252026 的 IG 帳號編號（不是機密）
concurrency:
  group: ig
  cancel-in-progress: false
jobs:
  check:
    if: github.event.inputs.task == 'check' || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查圖片和影片規格
        run: python3 tools/ig_post.py check
  token:
    if: github.event.schedule == '17 2 * * 1' || github.event.inputs.task == 'token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 確認 token 還能用
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig_post.py token
  post:
    if: github.event.schedule == '7,22,37,52 * * * *' || github.event.inputs.task == 'post'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 發到期的貼文
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig_post.py post
      - name: 記錄已發（失敗的也記下來，避免一直重試）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ig.json
          git diff --cached --quiet || { git commit -m "IG：記錄已發的貼文"; git pull -q --rebase; git push; }
  stats:
    if: github.event.schedule == '27 15 * * *' || github.event.inputs.task == 'stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓 IG 數字
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig_post.py stats
      - name: 存起來
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d stats/ig ] || exit 0
          git add stats/ig
          git diff --cached --quiet || { git commit -m "IG：每日數字"; git pull -q --rebase; git push; }
