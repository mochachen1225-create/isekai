# Threads 自動發文：每 15 分鐘看一次 posts/threads.json，發「已審核、時間到」的貼文，發完把 posted 寫回去。
# 每週一換一次 60 天長效 token（存回加密設定 THREADS_TOKEN）。
# 需要的加密設定（Settings → Secrets and variables → Actions）：
#   THREADS_TOKEN       使用者產生的 Threads token（短效也可以，第一次跑會自動換成長效）
#   THREADS_APP_SECRET  Meta App 的 Threads App secret
#   GH_SECRETS_PAT      只開這個 repo「Secrets: Read and write」的 fine-grained token，用來寫回新的 THREADS_TOKEN
name: Threads 自動發文
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '7 2 * * 1'
  workflow_dispatch:
    inputs:
      task:
        description: 'post（發到期的貼文）或 token（換長效 token）'
        default: post
permissions:
  contents: write
concurrency:
  group: threads
  cancel-in-progress: false
jobs:
  token:
    if: github.event.schedule == '7 2 * * 1' || github.event.inputs.task == 'token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 換長效 token 並存回加密設定
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -z "$THREADS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "加密設定還沒齊，跳過"; exit 0; fi
          NEW=$(python3 tools/threads_post.py token)
          echo "::add-mask::$NEW"
          gh secret set THREADS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "已換新 token"
  post:
    if: github.event.schedule == '*/15 * * * *' || github.event.inputs.task == 'post' || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 發到期的貼文
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 tools/threads_post.py post
      - name: 記錄已發
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/threads.json
          git diff --cached --quiet || { git commit -m "Threads：記錄已發的貼文"; git push; }
